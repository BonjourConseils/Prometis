# =====================================================================
#  Prometis — services de développement / CI
#
#  Note : la machine de développement actuelle n'a pas Docker installé et
#  utilise PostgreSQL 16 + Redis via Homebrew. Ce fichier cible la CI et
#  la production ; il reste la référence des versions attendues.
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: prometis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prometis
      POSTGRES_PASSWORD: prometis_dev
      POSTGRES_DB: prometis_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prometis -d prometis_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prometis-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
